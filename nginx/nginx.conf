# AI Key Gateway - Nginx unified entry (non-Docker)
# Generated from config/server.json via scripts/generate-nginx-conf.js
# DO NOT EDIT THIS FILE DIRECTLY; edit the template and rerun generation.

worker_processes  1;
pid               nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;

server_tokens off;
client_body_timeout 60s;
client_header_timeout 60s;
send_timeout 60s;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Upstreams are read from config/server.json
    upstream backend_api {
        server 127.0.0.1:3000;
    }

    upstream frontend_admin {
        server 127.0.0.1:3001;
    }

    upstream frontend_user {
        server 127.0.0.1:3002;
    }

    # Proxy settings for streaming API endpoints (kept in a map-like include is not
    # needed here; duplicated intentionally to keep the generated file self-contained)

    # User portal: 3004
    server {
        listen       3004;
        server_name  localhost;

add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

        location /api/ {
            proxy_pass http://backend_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
limit_req zone=api burst=20 nodelay;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
        }

        # OpenAI-compatible API key endpoints
        location /v1/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
limit_req zone=api burst=20 nodelay;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
        }

        # Gemini-compatible API key endpoints
        location /v1beta/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
limit_req zone=api burst=20 nodelay;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
        }

        # Anthropic-compatible API key endpoints
        location /anthropic/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
limit_req zone=api burst=20 nodelay;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://frontend_user/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    # Admin portal: 3005
    server {
        listen       3005;
        server_name  localhost;

add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
allow 127.0.0.1/32;
deny all;

        location /api/ {
            proxy_pass http://backend_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
limit_req zone=api burst=20 nodelay;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
        }

        # OpenAI-compatible API key endpoints
        location /v1/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
limit_req zone=api burst=20 nodelay;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
        }

        # Gemini-compatible API key endpoints
        location /v1beta/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
limit_req zone=api burst=20 nodelay;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
        }

        # Anthropic-compatible API key endpoints
        location /anthropic/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
limit_req zone=api burst=20 nodelay;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://frontend_admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
